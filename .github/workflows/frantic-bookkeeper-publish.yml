name: Frantic bookkeeper publish

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or ref containing skills/bookkeeper
        required: true
        default: frantic-bookkeeper-0.1.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          token: ${{ secrets.RUNX_USER_GH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish bookkeeper to runx registry
        env:
          GH_TOKEN: ${{ secrets.RUNX_USER_GH_TOKEN }}
        run: |
          set -euo pipefail
          gh auth status
          gh api --method PUT /user/starred/runxhq/runx
          npx -y @runxhq/cli@0.7.1 --version
          npx -y @runxhq/cli@0.7.1 login --provider github --for publish --from-gh --json | tee runx-login.json
          npx -y @runxhq/cli@0.7.1 registry read wilber123451-design/bookkeeper \
            --registry https://api.runx.ai \
            --json | tee runx-read-before.json || true
          set +e
          npx -y @runxhq/cli@0.7.1 registry publish ./skills/bookkeeper \
            --registry https://api.runx.ai \
            --json | tee runx-publish.json
          publish_status=$?
          set -e
          if [ "${publish_status}" -ne 0 ]; then
            if ! jq -e '.error.message | test("publish=unchanged")' runx-publish.json >/dev/null; then
              exit "${publish_status}"
            fi
          fi
          npx -y @runxhq/cli@0.7.1 registry read wilber123451-design/bookkeeper \
            --registry https://api.runx.ai \
            --json | tee runx-read.json
          published_version="$(jq -r '.registry.publish.version // .registry.skill.version' runx-publish.json runx-read.json | grep -v '^null$' | tail -n 1)"
          skill_ref="wilber123451-design/bookkeeper@${published_version}"
          echo "${skill_ref}" | tee runx-published-skill-ref.txt
          npx -y @runxhq/cli@0.7.1 registry read "${skill_ref}" \
            --registry https://api.runx.ai \
            --json | tee runx-read-versioned.json || true

          transactions="$(jq -c .transactions skills/bookkeeper/fixtures/clean-input.json)"
          chart="$(jq -c .chart_of_accounts skills/bookkeeper/fixtures/clean-input.json)"
          prior="$(jq -c .prior_period skills/bookkeeper/fixtures/clean-input.json)"

          set +e
          npx -y @runxhq/cli@0.7.1 skill "${skill_ref}" \
            --registry https://api.runx.ai \
            --input-json "transactions=${transactions}" \
            --input-json "chart_of_accounts=${chart}" \
            --input-json "prior_period=${prior}" \
            --json > runx-prep.out 2>&1
          prep_status=$?
          set -e
          cat runx-prep.out
          node <<'NODE' > runx-approval-digest.txt
          const fs = require('node:fs');
          const text = fs.readFileSync('runx-prep.out', 'utf8');
          let depth = 0, start = -1, end = -1, inString = false, escaped = false;
          for (let i = 0; i < text.length; i += 1) {
            const ch = text[i];
            if (start === -1) {
              if (ch === '{') { start = i; depth = 1; }
              continue;
            }
            if (inString) {
              if (escaped) escaped = false;
              else if (ch === '\\') escaped = true;
              else if (ch === '"') inString = false;
              continue;
            }
            if (ch === '"') inString = true;
            else if (ch === '{') depth += 1;
            else if (ch === '}') {
              depth -= 1;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end === -1) throw new Error('No leading JSON object in runx-prep.out');
          const parsed = JSON.parse(text.slice(start, end));
          if (!parsed.digest) throw new Error('No operator context digest in runx-prep.out');
          process.stdout.write(parsed.digest);
          NODE
          approval_digest="$(cat runx-approval-digest.txt)"
          npx -y @runxhq/cli@0.7.1 skill "${skill_ref}" \
            --registry https://api.runx.ai \
            --approve-operator-context "${approval_digest}" \
            --input-json "transactions=${transactions}" \
            --input-json "chart_of_accounts=${chart}" \
            --input-json "prior_period=${prior}" \
            --json | tee runx-dogfood.json
          npx -y @runxhq/cli@0.7.1 history --receipt-dir .runx/receipts --json | tee runx-history.json
          receipt_id="$(jq -r '.receipts | map(select(.status == "closed")) | sort_by(.created_at) | last.id' runx-history.json)"
          test -n "${receipt_id}" -a "${receipt_id}" != "null"
          receipt_file=".runx/receipts/${receipt_id/sha256:/sha256-}.json"
          cp "${receipt_file}" runx-dogfood-receipt.json
          npx -y @runxhq/cli@0.7.1 verify --receipt "${receipt_file}" --allow-local-development-signatures --json | tee runx-verify.json

      - name: Upload publish logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frantic-bookkeeper-publish
          path: |
            runx-login.json
            runx-publish.json
            runx-published-skill-ref.txt
            runx-read-before.json
            runx-read.json
            runx-read-versioned.json
            runx-prep.out
            runx-approval-digest.txt
            runx-dogfood.json
            runx-history.json
            runx-dogfood-receipt.json
            runx-verify.json
